[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transaction-dispute-copilot"
version = "0.5.0"
description = "Transaction Dispute & Fraud-Triage Copilot — rubric-aligned LangGraph implementation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22",
    # NOTE: the full `arize-phoenix` package (the collector + localhost:6006 UI)
    # unconditionally requires mcp>=2.0.0 via fastmcp-slim/pydantic-ai-slim, and
    # (as of the versions resolvable here) `langchain-mcp-adapters` is not yet
    # runtime-compatible with mcp 2.x (it imports mcp.shared.context.RequestContext,
    # which mcp 2.x removed) — so the full `arize-phoenix` package cannot live in
    # the same environment as a working MCP client. The app only needs the tracer
    # registration helper (`phoenix.otel.register`, used in
    # src/observability/tracing.py), which ships as the separate, dependency-light
    # `arize-phoenix-otel` package with no mcp/fastmcp dependency at all. Run the
    # actual Phoenix collector/UI as its own process in a separate environment —
    # see README.md "Observability" — it talks to this app over OTLP/HTTP, not
    # via a shared Python import, so this is the normal deployment shape anyway.
    "arize-phoenix-otel>=0.17,<1",
    "chromadb>=1.5,<2",
    "deepeval>=4.2,<5",
    "fastapi>=0.141,<1",
    # NOTE: `guardrails-ai` was previously listed here but is never imported
    # anywhere in this codebase (src/guardrails/validators.py is a from-scratch
    # implementation with zero dependency on the guardrails-ai package). It was
    # also the sole cause of an unresolvable openai<2 vs openai>=3 conflict
    # against arize-phoenix's own dependency tree. Removed; no functional loss.
    "httpx>=0.28,<1",
    "langchain>=1.4,<1.5",
    "langchain-core>=1.6,<1.7",
    "langchain-google-genai>=4.4,<5",
    "langchain-groq>=1.1,<2",
    "langchain-mcp-adapters==0.3.2",
    "langgraph>=1.2.11,<1.3",
    "matplotlib>=3.10,<4",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langmem==0.0.30",
    "mcp>=1.27.2,<2",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b0,<1",
    "opentelemetry-instrumentation-httpx>=0.66b0,<1",
    "opentelemetry-sdk>=1.45,<2",
    "openinference-instrumentation-langchain>=0.1,<1",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "python-dotenv>=1.1,<2",
    "PyYAML>=6.0,<7",
    "sentence-transformers>=6.1,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
    # streamlit_app.py: interactive dispute-intake / evidence-dashboard / human-review UI
    "pandas>=2.2,<3",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
# NOTE: the full Phoenix collector + localhost:6006 UI (the `arize-phoenix`
# package) is intentionally NOT declared as an extra here, even an isolated
# one. `uv lock`/`uv sync` compute one "universal" resolution that must be
# simultaneously satisfiable across every extra declared in this file (not
# just the ones you pass to --extra), so any extra requiring arize-phoenix
# (which needs mcp>=2 via fastmcp-slim) is unconditionally incompatible with
# this project's own `mcp>=1.27.2,<2` pin and breaks `uv lock` outright, even
# though pip itself would resolve it fine since pip only ever resolves the
# extras you actually request. Install the full package in a completely
# separate virtualenv instead — see README.md "Observability":
#   python3.12 -m venv .venv-phoenix && .venv-phoenix/bin/pip install arize-phoenix
#   .venv-phoenix/bin/phoenix serve
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
    "playwright>=1.55,<2",
    "pre-commit>=4,<5",
    "detect-secrets>=1.5,<2",
    "pip-audit>=2.9,<3",
]

[project.scripts]
copilot = "app.cli:main"

[tool.hatch.build.targets.wheel]
# Without this, `uv sync`/`pip install -e .` installs no code at all (no
# [build-system]/packages config previously existed), so `app`, `src` and
# `mcp_server` were never importable except via `python -m pytest` (which
# adds them via `pythonpath = ["."]` below) or a manually exported
# PYTHONPATH=. — `python scripts/seed_data.py` failed with
# ModuleNotFoundError otherwise. Declaring them here makes `uv sync` install
# the project in editable mode so every script and entry point just works.
packages = ["app", "src", "mcp_server"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
